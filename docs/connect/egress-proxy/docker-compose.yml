# Staging topology for customer-MCP egress (prepared, not deployed).
# The proxy is the ONLY component with a route out; app containers are internal.
version: "3.9"

networks:
  mcp-int:
    internal: true       # app containers: no default route
  mcp-egress: {}         # routed: proxy's only upstream path

services:
  egress-proxy:
    # UNPINNED - acceptance is invalid on :latest. Pin by digest (image@sha256:...) after an approved
    # supply-chain review, then run egress-probe.cjs against exactly that digest.
    image: stripe/smokescreen:latest
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    # No published ports: reachable only from the internal network.
    networks:
      - mcp-int
      - mcp-egress
    # Smokescreen reads its deny list ONLY from --deny-range (repeatable) or --config-file; it has no
    # environment-variable source, so the former DENY_RANGES env block was silently ignored (verified
    # against stripe/smokescreen cmd/smokescreen.go; re-verify against the pinned image).
    command:
      - "--listen-ip=0.0.0.0"
      - "--listen-port=3128"
      - "--deny-range=0.0.0.0/8"
      - "--deny-range=10.0.0.0/8"
      - "--deny-range=100.64.0.0/10"
      - "--deny-range=127.0.0.0/8"
      - "--deny-range=169.254.0.0/16"
      - "--deny-range=172.16.0.0/12"
      - "--deny-range=192.0.0.0/24"
      - "--deny-range=192.0.2.0/24"
      - "--deny-range=192.168.0.0/16"
      - "--deny-range=198.18.0.0/15"
      - "--deny-range=198.51.100.0/24"
      - "--deny-range=203.0.113.0/24"
      - "--deny-range=224.0.0.0/4"
      - "--deny-range=240.0.0.0/4"
      - "--deny-range=::/128"
      - "--deny-range=::1/128"
      - "--deny-range=64:ff9b::/96"
      - "--deny-range=100::/64"
      - "--deny-range=2001:db8::/32"
      - "--deny-range=fc00::/7"
      - "--deny-range=fe80::/10"
      - "--deny-range=ff00::/8"

  # Test-only probe (same internal network) â€” used by docs/connect/egress-proxy/egress-probe.cjs.
  probe:
    image: node:22-alpine
    profiles: ["test"]
    networks:
      - mcp-int
    depends_on:
      - egress-proxy
